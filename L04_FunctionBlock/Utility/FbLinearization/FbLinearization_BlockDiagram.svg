<style>text {font-family:DejaVu Sans,sans-serif;fill:#173247;font-size:18px}.title{font-size:29px;font-weight:bold}.heading{font-size:21px;font-weight:bold}.small{font-size:15px}.pin{font-family:DejaVu Sans Mono,monospace;font-size:18px}.param{font-family:DejaVu Sans Mono,monospace;font-size:14px}.frame{fill:#f5f9fc;stroke:#173247;stroke-width:2.5}.group{fill:white;stroke:#7b93a5;stroke-width:1.5;stroke-dasharray:7 5}.box{fill:#e6f0f7;stroke:#34536b;stroke-width:1.5}.wire{fill:none;stroke:#34536b;stroke-width:2;marker-end:url(#arrow)}.setting{fill:none;stroke:#677f91;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}.port{fill:white;stroke:#173247;stroke-width:2}</style></defs>
